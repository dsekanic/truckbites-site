<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support | TruckBites</title>
  <meta name="description" content="Contact TruckBites support, report a bug, or ask a question." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <a href="index.html" class="brand" aria-label="TruckBites home">
      <img src="/images/truckbites-logo.png" alt="TruckBites logo" class="brand-logo" />
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="vendor-signup.html">Vendors</a>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <span class="badge">Support</span>
        <h1>How can we help?</h1>
        <p>Contact TruckBites, ask a question, report a bug, or let us know if something is not working correctly.</p>
      </div>
    </section>

    <section class="forms-grid">
      <form class="form-card" action="https://formspree.io/f/xjgzlreg" method="POST">
        <input type="hidden" name="_subject" value="New TruckBites Support Request" />
        <input type="hidden" name="form_type" value="Support Request" />

        <h2>Contact Support</h2>

        <label>Name
          <input type="text" name="name" />
        </label>

        <label>Email
          <input type="email" name="email" required />
        </label>

        <label>Reason
          <select name="request_type" required>
            <option value="">Select one</option>
            <option value="Vendor Help">Vendor Help</option>
            <option value="App Issue">App Issue</option>
            <option value="Partnership">Partnership</option>
            <option value="General Question">General Question</option>
          </select>
        </label>

        <label>Message
          <textarea name="message" rows="5" required></textarea>
        </label>

        <button type="submit">Send Message</button>
      </form>

      <form class="form-card" action="https://formspree.io/f/xjgzlreg" method="POST">
        <input type="hidden" name="_subject" value="New TruckBites Bug Report" />
        <input type="hidden" name="form_type" value="Bug Report" />

        <h2>Report a Bug</h2>

        <label>Email
          <input type="email" name="email" required />
        </label>

        <label>Device
          <select name="device_type" required>
            <option value="">Select one</option>
            <option value="iPhone">iPhone</option>
            <option value="Android">Android</option>
            <option value="Web">Web</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label>Where did it happen?
          <input type="text" name="location_in_app" placeholder="Example: Vendor signup, map, menu, profile page" />
        </label>

        <label>What happened?
          <textarea name="message" rows="5" required></textarea>
        </label>

        <button type="submit">Report Bug</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-links">
      <a href="vendor-signup.html">Vendor Signup</a>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
    <p class="copyright">&copy; 2026 TruckBites. Find Local Flavor.</p>
  </footer>
</body>
</html>
