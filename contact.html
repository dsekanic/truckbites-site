<section class="forms-grid">
  <form class="form-card" action="https://formspree.io/f/xjgzlreg" method="POST">
    <input type="hidden" name="_subject" value="New TruckBites Contact Form Submission" />
    <input type="hidden" name="form_type" value="Contact Form" />
    <input type="hidden" name="_next" value="https://gettruckbites.com/success.html" />

    <h2>Contact Us</h2>

    <label>Name
      <input type="text" name="name" required />
    </label>

    <label>Email
      <input type="email" name="email" required />
    </label>

    <label>Reason
      <select name="reason" required>
        <option value="">Select one</option>
        <option value="General Question">General Question</option>
        <option value="Vendor Question">Vendor Question</option>
        <option value="Partnership">Partnership</option>
        <option value="Media Request">Media Request</option>
        <option value="Launch Information">Launch Information</option>
      </select>
    </label>

    <label>Message
      <textarea name="message" rows="6" required></textarea>
    </label>

    <button type="submit">Send Message</button>
  </form>

  <div class="form-card">
    <h2>Need technical help?</h2>
    <p>
      If something on the website or app is not working, use the support page
      to report the issue.
    </p>

    <a href="support.html" class="btn-secondary">Go to Technical Support</a>
  </div>
</section>
