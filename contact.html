<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact TruckBites | Vendor Signup & Support</title>
  <meta name="description" content="Contact TruckBites, sign up as a food truck vendor, report a bug, or join the launch list." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <a href="index.html" class="brand" aria-label="TruckBites home">
      <img src="/images/truckbites-logo.png" alt="TruckBites logo" class="brand-logo" />
      <span class="brand-name">TruckBites</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Contact TruckBites</h1>
      <p>Vendor signup, support, bug reports, partnerships, and launch updates all start here.</p>
    </section>

    <section class="forms-grid">
      <form class="form-card" action="https://formspree.io/f/xjgzlreg" method="POST">
        <input type="hidden" name="_subject" value="New TruckBites Vendor Interest Form Submission" />
        <input type="hidden" name="form_type" value="Vendor Interest" />

        <h2>Vendor Interest Form</h2>

        <label>Food Truck / Business Name
          <input type="text" name="business_name" required />
        </label>

        <label>Contact Name
          <input type="text" name="contact_name" required />
        </label>

        <label>Email
          <input type="email" name="email" required />
        </label>

        <label>Phone
          <input type="tel" name="phone" />
        </label>

        <label>City
          <input type="text" name="city" />
        </label>

        <label>State
          <input type="text" name="state" />
        </label>

        <label>Type of Food / Cuisine
          <input type="text" name="cuisine" required />
        </label>

        <label>Social Media or Website Link
          <input type="url" name="social_link" />
        </label>

        <label class="checkbox-label">
          <input type="checkbox" name="photo_permission" value="Yes" />
          I give TruckBites permission to use public photos for proof-of-concept mockups.
        </label>

        <label>Notes
          <textarea name="notes" rows="4"></textarea>
        </label>

        <button type="submit">Join the Vendor Launch List</button>
      </form>

      <form class="form-card" action="https://formspree.io/f/xjgzlreg" method="POST">
        <input type="hidden" name="_subject" value="New TruckBites Support Request" />
        <input type="hidden" name="form_type" value="Support Request" />

        <h2>Contact Support</h2>

        <label>Name
          <input type="text" name="name" />
        </label>

        <label>Email
          <input type="email" name="email" required />
        </label>

        <label>Reason
          <select name="request_type" required>
            <option value="">Select one</option>
            <option value="Vendor Help">Vendor Help</option>
            <option value="App Issue">App Issue</option>
            <option value="Partnership">Partnership</option>
            <option value="General Question">General Question</option>
          </select>
        </label>

        <label>Message
          <textarea name="message" rows="5" required></textarea>
        </label>

        <button type="submit">Send Message</button>
      </form>

      <form class="form-card" action="https://formspree.io/f/xjgzlreg" method="POST">
        <input type="hidden" name="_subject" value="New TruckBites Bug Report" />
        <input type="hidden" name="form_type" value="Bug Report" />

        <h2>Report a Bug</h2>

        <label>Email
          <input type="email" name="email" required />
        </label>

        <label>Device
          <select name="device_type" required>
            <option value="">Select one</option>
            <option value="iPhone">iPhone</option>
            <option value="Android">Android</option>
            <option value="Web">Web</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label>Where did it happen?
          <input type="text" name="location_in_app" />
        </label>

        <label>What happened?
          <textarea name="message" rows="5" required></textarea>
        </label>

        <button type="submit">Report Bug</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TruckBites. Find Local Flavor.</p>
  </footer>
</body>
</html>
